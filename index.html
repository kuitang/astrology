<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000008" />
    <meta name="description" content="3D geocentric orrery — explore natal charts, transits, and dignities" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Astrology Orrery</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; color: #fff; position: fixed; touch-action: none; }
      #app { width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #canvas-wrapper { flex: 1; min-height: 0; overflow: hidden; position: relative; }

      /* Info panel — scrollable overlay */
      #info-panel {
        position: absolute;
        pointer-events: auto;
        background: rgba(0,0,0,0.85);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 12px;
        backdrop-filter: blur(8px);
        display: none;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.4;
        /* Desktop default */
        top: 60px; right: 12px;
        width: 300px; max-height: 70vh;
        border-radius: 8px;
        animation: fadeSlideIn 0.3s ease-out;
      }
      /* Compact horizontal grid: label value | label value */
      #info-panel .info-grid {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 2px 8px;
        margin-bottom: 8px;
      }
      #info-panel .info-grid dt { color: #888; font-size: 12px; white-space: nowrap; }
      #info-panel .info-grid dd { margin: 0; font-weight: 500; }
      /* Label-above-value 2-column cards for constellation info */
      #info-panel .info-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
        margin-bottom: 8px;
      }
      #info-panel .info-cards .card-label { color: #888; font-size: 11px; }
      #info-panel .info-cards .card-value { font-weight: 500; font-size: 13px; }
      #info-panel .interp-text { font-size: 12px; color: #bbb; line-height: 1.45; margin-top: 6px; }
      #info-panel details { margin-top: 6px; font-size: 12px; color: #999; }
      #info-panel details summary { cursor: pointer; color: #aaa; }
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 767px) {
        #info-panel {
          top: auto; right: 0;
          bottom: 0; left: 0;
          width: 100%; max-height: 40vh;
          border-radius: 12px 12px 0 0;
          animation: fadeSlideUp 0.3s ease-out;
        }
        @keyframes fadeSlideUp {
          from { opacity: 0; transform: translateY(30px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        /* Compact toolbar on mobile */
        .app-toolbar .toolbar-date-input,
        .app-toolbar .toolbar-city-input {
          font-size: 13px !important;
          height: 32px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
